name: fs-ecac-manual
services:
  desktop:
    build: ./manual-desktop
    hostname: fs-ecac-manual
    init: true
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - '127.0.0.1:6081:6080'
    volumes:
      - manual_home:/home/operator
      - ./secrets/certificate.pfx:/run/secrets/certificate.pfx:ro
      - ./secrets/passphrase:/run/secrets/passphrase:ro
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null && pgrep -x chrome >/dev/null']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
volumes:
  manual_home:
