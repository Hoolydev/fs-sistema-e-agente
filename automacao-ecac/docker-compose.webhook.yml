# Publica no agente (api) o webhook da Z-API (mesmo endereço que a ponte fs-mac-bridge atendia) e /sistema (pedidos do sistema FS, com token):
#   https://api.fssolucoestributarias.com.br/zapi/<token>
# Labels espelham os da ponte (lidos em 01/10/2026). Antes de parar a ponte: ZAPI_WEBHOOK_TOKEN do .env igual ao WEBHOOK_TOKEN dela.
services:
  api:
    # Na rede coolify os nomes "redis" e "postgres" resolvem para os serviços do Coolify. O arquivo .env.api-rede
    # (gerado na VPS, modo 600) aponta REDIS_URL e DATABASE_URL para fs-automacao-ecac-redis-1 e fs-automacao-ecac-postgres-1.
    env_file:
      - .env
      - .env.api-rede
    networks:
      - backend
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.fsagent-redir.redirectscheme.scheme=https
      - traefik.http.routers.fsagent-http.entrypoints=http
      - traefik.http.routers.fsagent-http.middlewares=fsagent-redir
      - traefik.http.routers.fsagent-http.rule=Host(`api.fssolucoestributarias.com.br`) && (PathPrefix(`/zapi`) || PathPrefix(`/webhooks/zapi`) || PathPrefix(`/sistema`))
      - traefik.http.routers.fsagent.entrypoints=https
      - traefik.http.routers.fsagent.rule=Host(`api.fssolucoestributarias.com.br`) && (PathPrefix(`/zapi`) || PathPrefix(`/webhooks/zapi`) || PathPrefix(`/sistema`))
      - traefik.http.routers.fsagent.tls=true
      - traefik.http.routers.fsagent.tls.certresolver=letsencrypt
      - traefik.http.services.fsagent.loadbalancer.server.port=3000
networks:
  coolify:
    external: true
